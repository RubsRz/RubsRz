# Genera la animación de la serpiente con tus contribuciones (en los azules del portafolio)
# y la publica en la rama `output`.
# Corre una vez al día, y también se puede lanzar a mano desde la pestaña Actions.
name: Snake de contribuciones

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#c6d8fb,#8fb3f7,#5b8ff0,#2563eb
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#5b93ff&color_dots=#161b22,#1e3a6e,#2b58a8,#3f7be0,#5b93ff

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
